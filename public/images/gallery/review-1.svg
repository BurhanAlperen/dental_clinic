<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="avatarGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0a1628" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="500" height="500" fill="#f1f5f9" />
  <rect x="25" y="25" width="450" height="450" rx="24" fill="url(#cardBg)" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)" />

  <!-- Top Bar: Google Badge -->
  <g transform="translate(55, 55)">
    <!-- Google "G" Icon -->
    <svg width="28" height="28" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
      <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24Z"/>
      <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z"/>
      <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
    </svg>
    <text x="36" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Google Değerlendirmesi</text>
    <rect x="250" y="2" width="85" height="24" rx="12" fill="#e8faf5" />
    <text x="260" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0096b7">✓ Doğrulanmış</text>
  </g>

  <!-- Divider -->
  <line x1="55" y1="100" x2="445" y2="100" stroke="#f1f5f9" stroke-width="2" />

  <!-- Author Info -->
  <g transform="translate(55, 125)">
    <!-- Avatar circle -->
    <circle cx="28" cy="28" r="28" fill="url(#avatarGrad1)" />
    <text x="28" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">AY</text>
    
    <!-- Name and Details -->
    <text x="70" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Ahmet Y.</text>
    <text x="70" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">Yerel Rehber • 2 ay önce</text>
  </g>

  <!-- 5 Gold Stars -->
  <g transform="translate(55, 205)" fill="#f59e0b">
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" transform="scale(1.2)" />
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" transform="translate(32, 0) scale(1.2)" />
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" transform="translate(64, 0) scale(1.2)" />
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" transform="translate(96, 0) scale(1.2)" />
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" transform="translate(128, 0) scale(1.2)" />
  </g>

  <!-- Quote mark -->
  <text x="50" y="275" font-family="Georgia, serif" font-size="44" fill="#cbd5e1" opacity="0.8">“</text>

  <!-- Review Text -->
  <g transform="translate(55, 270)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" line-height="1.6" fill="#334155" font-weight="400">
      <tspan x="0" y="0">Harika bir klinik! Mustafa Bey çok ilgili ve</tspan>
      <tspan x="0" y="26">başarılı bir hekim. Tedavimden çok</tspan>
      <tspan x="0" y="52">memnun kaldım. Kesinlikle tavsiye</tspan>
      <tspan x="0" y="78">ederim.</tspan>
    </text>
  </g>

  <!-- Bottom Accent / Brand badge -->
  <g transform="translate(55, 415)">
    <rect width="390" height="34" rx="8" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
    <circle cx="16" cy="17" r="5" fill="#10b981"/>
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">Turhal Ağız ve Diş Sağlığı Polikliniği</text>
  </g>
</svg>
